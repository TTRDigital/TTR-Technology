# Builds the static site and uploads it to SiteGround over FTPS.
# Runs on every push, when Sanity publishes (webhook -> repository_dispatch),
# and from Actions > "Deploy to SiteGround" > Run workflow.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SG_FTP_SERVER    FTP host from SiteGround Site Tools > Site > FTP Accounts
#   SG_FTP_USERNAME  FTP account
#   SG_FTP_PASSWORD
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SANITY_PROJECT_ID  the TTR Technology Sanity project (empty: built-in content)
#   SG_FTP_DIR         (optional; folder the site goes into, default ./public_html/)
#   GTM_ID, GA_ID      (optional; default to the live site's GTM-NP26ZWXW and GT-PLWZ36P4)
name: Deploy to SiteGround

on:
  push:
    branches: [claude/trusting-thompson-4xuvei, main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # At job level so the steps' `if:` checks can see them.
    env:
      SG_FTP_SERVER: ${{ secrets.SG_FTP_SERVER }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID || 'GTM-NP26ZWXW' }}
      NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID || 'GT-PLWZ36P4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The resized WebP images only change when an image does; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}
          restore-keys: img-

      - name: Build static site
        run: npm run build

      # Download from the run page for a manual upload.
      - name: Keep a copy of the site
        uses: actions/upload-artifact@v4
        with:
          name: ttr-technology-site
          path: out/
          include-hidden-files: true
          retention-days: 14

      - name: Upload to SiteGround
        # Skipped (build check only) until the FTP secrets are added.
        if: env.SG_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SG_FTP_SERVER }}
          username: ${{ secrets.SG_FTP_USERNAME }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          # The FTP account's home is the site folder (Home Path "/" in Site Tools), so files go into public_html.
          server-dir: ${{ vars.SG_FTP_DIR || './public_html/' }}
